<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тетрис | Классическая игра</title>
    <meta name="description" content="Играйте в классический Тетрис прямо в браузере">
    <link rel="stylesheet" href="styles/main.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Главное меню -->
    <div id="main-menu" class="screen active">
        <div class="menu-container">
            <h1 class="game-title">ТЕТРИС</h1>
            <div class="menu-buttons">
                <button id="play-btn" class="menu-btn primary">Играть</button>
                <button id="settings-btn" class="menu-btn">Настройки</button>
                <button id="highscores-btn" class="menu-btn">Рекорды</button>
                <button id="controls-btn" class="menu-btn">Управление</button>
            </div>
        </div>
    </div>

    <!-- Игровой экран -->
    <div id="game-screen" class="screen">
        <div class="game-container">
            <!-- Левая панель -->
            <div class="game-sidebar left">
                <div class="info-panel">
                    <h3>СЧЕТ</h3>
                    <div id="score" class="score-value">0</div>
                </div>
                <div class="info-panel">
                    <h3>УРОВЕНЬ</h3>
                    <div id="level" class="level-value">1</div>
                </div>
                <div class="info-panel">
                    <h3>ЛИНИИ</h3>
                    <div id="lines" class="lines-value">0</div>
                </div>
            </div>

            <!-- Игровое поле -->
            <div class="game-main">
                <canvas id="game-canvas" width="300" height="600"></canvas>
                <div id="game-overlay" class="game-overlay hidden">
                    <div class="overlay-content">
                        <h2 id="overlay-title">ПАУЗА</h2>
                        <p id="overlay-message">Нажмите P для продолжения</p>
                    </div>
                </div>
            </div>

            <!-- Правая панель -->
            <div class="game-sidebar right">
                <div class="info-panel">
                    <h3>СЛЕДУЮЩАЯ</h3>
                    <canvas id="next-canvas" width="120" height="120"></canvas>
                </div>
                <div class="controls-hint">
                    <h4>УПРАВЛЕНИЕ</h4>
                    <p>← → Движение</p>
                    <p>↑ Поворот</p>
                    <p>↓ Ускорение</p>
                    <p>SPACE Сброс</p>
                    <p>P Пауза</p>
                </div>
            </div>
        </div>

        <!-- Кнопки управления игрой -->
        <div class="game-controls">
            <button id="pause-btn" class="control-btn">Пауза</button>
            <button id="restart-btn" class="control-btn">Заново</button>
            <button id="menu-btn" class="control-btn">Меню</button>
        </div>
    </div>

    <!-- Экран окончания игры -->
    <div id="gameover-screen" class="screen">
        <div class="gameover-container">
            <h2>ИГРА ОКОНЧЕНА</h2>
            <div class="final-score">
                <p>Ваш счет: <span id="final-score">0</span></p>
                <p>Уровень: <span id="final-level">1</span></p>
                <p>Линии: <span id="final-lines">0</span></p>
            </div>
            <div id="new-record" class="new-record hidden">
                🏆 НОВЫЙ РЕКОРД! 🏆
            </div>
            <div class="gameover-buttons">
                <button id="play-again-btn" class="menu-btn primary">Играть снова</button>
                <button id="back-to-menu-btn" class="menu-btn">В меню</button>
            </div>
        </div>
    </div>

    <!-- Модальное окно настроек -->
    <div id="settings-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Настройки</h3>
                <button id="close-settings" class="close-btn">&times;</button>
            </div>
            <div class="modal-body">
                <div class="setting-group">
                    <label for="music-volume">Музыка:</label>
                    <input type="range" id="music-volume" min="0" max="100" value="50">
                    <span id="music-vol-display">50%</span>
                </div>
                <div class="setting-group">
                    <label for="sfx-volume">Звуки:</label>
                    <input type="range" id="sfx-volume" min="0" max="100" value="70">
                    <span id="sfx-vol-display">70%</span>
                </div>
                <div class="setting-group">
                    <label for="theme-select">Тема:</label>
                    <select id="theme-select">
                        <option value="classic">Классическая</option>
                        <option value="neon">Неон</option>
                        <option value="retro">Ретро</option>
                    </select>
                </div>
                <div class="setting-group">
                    <label>
                        <input type="checkbox" id="show-ghost"> Показывать тень фигуры
                    </label>
                </div>
            </div>
        </div>
    </div>

    <!-- Загрузка скриптов -->
    <script type="module" src="src/main.js"></script>
</body>
</html>
